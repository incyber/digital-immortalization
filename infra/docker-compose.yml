# Local infrastructure. Everything here is a container, so nothing is installed
# on the host. The same three services exist in cloud; only their configuration
# and placement differ.
services:
  # WebRTC SFU. --dev mode issues the well-known devkey/secret pair and skips
  # TLS, which is correct for localhost and must never be used in cloud.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"       # signalling (WebSocket) and HTTP API
      - "7881:7881"       # WebRTC over TCP, the fallback path
      - "7882:7882/udp"   # WebRTC over UDP, the normal path
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: avatar
      POSTGRES_DB: avatar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar"]
      interval: 5s
      retries: 10

  # Piper runs here rather than inside the application process. piper-tts is
  # GPL-3.0-or-later; importing it links a GPL library into proprietary code,
  # while calling it over HTTP is aggregation. This is the only GPL code in
  # the project and it is confined to this image.
  #
  # Port 5050 rather than 5000: macOS binds 5000 for AirPlay Receiver.
  piper:
    build: ./piper
    environment:
      PIPER_VOICE: es_ES-davefx-medium
    ports:
      - "5050:5050"
    volumes:
      - ../assets/voices:/voices:ro
    restart: unless-stopped

  # Face geometry. One licence-clean detector for the whole system, replacing
  # the non-commercial ones both renderers ship. CPU only, so it never
  # competes with the GPU the renderers need.
  facegeom:
    build: ./facegeom
    ports:
      - "7001:7001"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
