# Builds the serverless GPU worker and pushes it to the container registry.
#
# Built here rather than locally for two reasons. The image is linux/amd64 and
# development happens on Apple Silicon, so a local build is an emulated
# cross-build measured in hours. And the image is large enough that the upload
# from a laptop costs more wall-clock than the build itself.
#
# Triggered by hand. This produces an artefact that costs money to run, so it
# is not something a push to a branch should start on its own.
name: gpu-worker

on:
  workflow_dispatch:
    inputs:
      image:
        # gpu-worker is LivePortrait and CosyVoice; splatworker is gsplat and
        # TRELLIS, which is a second publishable image rather than a task on
        # the first because it needs a CUDA devel base to compile kernels and
        # its jobs run for minutes rather than seconds.
        description: Which image to build
        required: true
        default: gpu-worker
        type: choice
        options:
          - gpu-worker
          - musetalk
          - splatworker-reconstruct
          - splatworker-generate
          - probe
      tag:
        description: Image tag to publish
        required: true
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/${{ inputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The image is roughly 15GB with weights baked in, and a stock runner has
      # about 14GB free. These four directories are preinstalled toolchains
      # this build never touches.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost
          df -h /

      # Worked out in a step rather than in an expression, because Actions
      # has no string-replace function and an expression that looks right but
      # is not a real function fails at run time rather than at parse time.
      - name: Work out which file and stage to build
        id: plan
        run: |
          case "${{ inputs.image }}" in
            splatworker-*) dir=splatworker; target="${{ inputs.image }}"; target="${target#splatworker-}" ;;
            gpu-worker)    dir=serverless;  target="" ;;
            *)             dir="${{ inputs.image }}"; target="" ;;
          esac
          echo "dockerfile=infra/$dir/Dockerfile" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "building infra/$dir/Dockerfile ${target:+(stage $target)}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # infra/ rather than infra/serverless: the Dockerfile copies the
          # face service and the LivePortrait patches from their existing
          # directories instead of keeping a second copy of either.
          context: infra
          file: ${{ steps.plan.outputs.dockerfile }}
          # The splat routes are two stages of one Dockerfile: reconstruct
          # holds the CUDA, torch and gsplat work, and generate builds on top
          # of it. Building a stage by name means the shared half is compiled
          # once and cached rather than repeated by a second file that drifts.
          target: ${{ steps.plan.outputs.target }}
          platforms: linux/amd64
          push: true
          # A plain single-platform manifest, not an OCI index. buildx defaults
          # to attaching a provenance attestation, which turns the tag into an
          # index holding the real image plus an "unknown/unknown" entry. Some
          # runtimes pull that happily and some sit in `initializing` forever;
          # nothing here needs the attestation.
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ inputs.tag }}
          # Layer cache in the registry. A one-line handler change then rebuilds
          # in minutes instead of refetching 2.6GB of weights.
          # ignore-error, because the first build of a new image has no
          # cache to import and buildx treats that as fatal rather than as a
          # cold start.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,ignore-error=true
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max

      - name: Report
        run: |
          echo "pushed ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This image is not running anywhere yet. It costs nothing until an" >> $GITHUB_STEP_SUMMARY
          echo "endpoint is created and a job is queued against it." >> $GITHUB_STEP_SUMMARY
