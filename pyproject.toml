[project]
name = "avatar"
version = "0.1.0"
description = "Live avatar call platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pipecat-ai[livekit,mlx-whisper,openai,silero,whisper]>=1.7.0",
    "livekit-api>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "redis>=5.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",  # 5.x removed the bundled Haar cascade API
    "httpx>=0.28",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
