[project]
name = "avatar"
version = "0.1.0"
description = "Live avatar call platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pipecat-ai[livekit,mlx-whisper,openai,silero,whisper]>=1.7.0",
    "livekit-api>=1.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "redis>=5.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",  # 5.x removed the bundled Haar cascade API
    "httpx>=0.28",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "piper-tts>=1.3",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.5",
    "boto3>=1.43.79",
    "mediapipe>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar"]
# The built web app, which the gateway serves so that the site and the API
# share one origin (see gateway/web.py). It is generated output and therefore
# in .gitignore, and hatchling honours .gitignore when deciding what to
# package — so without this line the wheel installs a gateway with no site in
# it and every page is a 404. `artifacts` is the escape hatch for exactly this:
# build output that must ship even though version control ignores it.
artifacts = ["src/avatar/gateway/webroot/**"]

[tool.pytest.ini_options]
# Long-running property checks. Kept in the default run because the property
# they defend - that the likeness never settles into a rhythm - is the whole
# requirement, and a check that only runs on demand is a check nobody runs.
markers = ["slow: takes seconds rather than milliseconds"]
asyncio_mode = "auto"
testpaths = ["tests"]
# repo root on sys.path so shared test helpers import as tests.*
pythonpath = ["."]

[tool.ruff]
line-length = 100
